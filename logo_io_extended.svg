<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');
      .brand-text { font-family: 'Product Sans', 'Montserrat', 'Segoe UI', sans-serif; font-weight: 700; fill: #1f1f1f; font-size: 70px; letter-spacing: -1.5px; }
      .extended-text { font-family: 'Montserrat', 'Product Sans', 'Segoe UI', sans-serif; font-weight: 600; fill: #ffffff; font-size: 32px; letter-spacing: -0.5px; }
    </style>
  </defs>
  
  <!-- "Google" Text -->
  <text x="5" y="86" class="brand-text">Google</text>
  
  <!-- "I/O" Graphic Elements -->
  <!-- Vertical Bar (I) -->
  <rect x="290" y="26" width="22" height="66" rx="3" fill="#1f1f1f" />
  
  <!-- Forward Slash (/) -->
  <polygon points="334,92 344,92 326,26 316,26" fill="#1f1f1f" />
  
  <!-- Circle (O) -->
  <circle cx="388" cy="59" r="32" fill="#1f1f1f" />
  
  <!-- "Extended" Black Pill Badge -->
  <rect x="440" y="24" width="195" height="70" rx="35" fill="#1f1f1f" />
  <text x="537" y="70" text-anchor="middle" class="extended-text">Extended</text>
</svg>
